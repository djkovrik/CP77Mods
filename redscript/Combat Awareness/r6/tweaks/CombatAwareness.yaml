CombatAwareness.Readiness:
  $type: StatusEffect
  duration: BaseStats.InfiniteDuration
  statusEffectType: BaseStatusEffectTypes.PassiveBuff
  gameplayTags: [Buff, CombatAwareness]
  savable: false

CombatAwareness.ThreatDetection:
  $base: CombatAwareness.Readiness
  uiData:
    $type: StatusEffectUIData
    displayName: LocKey#Mod-CombatAwareness-ThreatDetection
    description: LocKey#Mod-CombatAwareness-ThreatDetection-Desc
    iconPath: perks_sensory_protocol

CombatAwareness.InitiativeReaction:
  $base: CombatAwareness.Readiness
  uiData:
    $type: StatusEffectUIData
    displayName: LocKey#Mod-CombatAwareness-InitiativeReaction
    description: LocKey#Mod-CombatAwareness-InitiativeReaction-Desc
    iconPath: reflex_recorder

CombatAwareness.ReactionDuration:
  $type: ConstantStatModifier
  statType: BaseStats.MaxDuration
  modifierType: Additive
  value: 3.0

CombatAwareness.InitiativeReactionWindow:
  $base: CombatAwareness.InitiativeReaction
  duration:
    $type: StatModifierGroup
    statModifiers:
      - CombatAwareness.ReactionDuration

CombatAwareness.SpreadAdsDefaultX:
  $type: ConstantStatModifier
  statType: BaseStats.SpreadAdsDefaultX
  modifierType: Multiplier
  value: 0.75

CombatAwareness.SpreadAdsDefaultY:
  $type: ConstantStatModifier
  statType: BaseStats.SpreadAdsDefaultY
  modifierType: Multiplier
  value: 0.75

CombatAwareness.SpreadAdsMinX:
  $type: ConstantStatModifier
  statType: BaseStats.SpreadAdsMinX
  modifierType: Multiplier
  value: 0.75

CombatAwareness.SpreadAdsMinY:
  $type: ConstantStatModifier
  statType: BaseStats.SpreadAdsMinY
  modifierType: Multiplier
  value: 0.75

CombatAwareness.SpreadAdsMaxX:
  $type: ConstantStatModifier
  statType: BaseStats.SpreadAdsMaxX
  modifierType: Multiplier
  value: 0.75

CombatAwareness.SpreadAdsMaxY:
  $type: ConstantStatModifier
  statType: BaseStats.SpreadAdsMaxY
  modifierType: Multiplier
  value: 0.75

CombatAwareness.SpreadAdsChangePerShot:
  $type: ConstantStatModifier
  statType: BaseStats.SpreadAdsChangePerShot
  modifierType: Multiplier
  value: 0.75

CombatAwareness.PrecisionAttackUI:
  $type: StatusEffectUIData
  displayName: LocKey#Mod-CombatAwareness-PrecisionAttack
  description: LocKey#Mod-CombatAwareness-PrecisionAttack-Desc
  iconPath: perks_aim

CombatAwareness.PrecisionAttack:
  $base: CombatAwareness.Readiness
  uiData: CombatAwareness.PrecisionAttackUI
  packages:
    - $type: GameplayLogicPackage
      effectors:
        - $base: Perks.ApplyStatGroupOnWeapon
          effectorClassName: ApplyStatGroupEffector
          prereqRecord: Prereqs.AlwaysTruePrereq
          reapplyOnWeaponChange: true
          statGroup:
            $type: StatModifierGroup
            statModifiers:
              - CombatAwareness.SpreadAdsDefaultX
              - CombatAwareness.SpreadAdsDefaultY
              - CombatAwareness.SpreadAdsMinX
              - CombatAwareness.SpreadAdsMinY
              - CombatAwareness.SpreadAdsMaxX
              - CombatAwareness.SpreadAdsMaxY
              - CombatAwareness.SpreadAdsChangePerShot

CombatAwareness.SpotWeaknessUI:
  $type: StatusEffectUIData
  displayName: LocKey#Mod-CombatAwareness-SpotWeakness
  description: LocKey#Mod-CombatAwareness-SpotWeakness-Desc
  iconPath: perks_knife

CombatAwareness.SpotWeakness:
  $base: CombatAwareness.Readiness
  uiData: CombatAwareness.SpotWeaknessUI

CombatAwareness.DamageDeflection:
  $base: CombatAwareness.Readiness
  uiData:
    $type: StatusEffectUIData
    displayName: LocKey#Mod-CombatAwareness-DamageDeflection
    description: LocKey#Mod-CombatAwareness-DamageDeflection-Desc
    iconPath: armor_boost

CombatAwareness.FumbleRecovery:
  $base: CombatAwareness.Readiness
  uiData:
    $type: StatusEffectUIData
    displayName: LocKey#Mod-CombatAwareness-FumbleRecovery
    description: LocKey#Mod-CombatAwareness-FumbleRecovery-Desc
    iconPath: perks_reload

CombatAwareness.PreparedScript:
  $base: CombatAwareness.Readiness
  uiData:
    $type: StatusEffectUIData
    displayName: LocKey#Mod-CombatAwareness-PreparedScript
    description: LocKey#Mod-CombatAwareness-PreparedScript-Desc
    iconPath: memory_replenishment

CombatAwareness.StudiedTargetMappin:
  $type: MappinDefinition
  possibleVariants: [Mappins.AimVariant]
  showInWorld: true
  showOnMap: false
  showOnMinimap: false
